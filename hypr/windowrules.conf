windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-nautilus
    match:class = ^(org.gnome.Nautilus)$
    float = true
    center = true
}

windowrule {
    name = float-imv
    match:class = ^(imv)$
    float = true
    center = true
}

windowrule {
    name = float-mpv
    match:class = ^(mpv)$
    float = true
    center = true
}

layerrule = match:namespace rofi, blur on
layerrule = match:namespace logout_dialog, blur on

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.5

layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.5