source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/colors.conf

monitor = HDMI-A-1, 1366x768@60, 0x0, 1
monitor = eDP-1, 1920x1080@144, 0x768, 1.25

env = XCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

input {
    kb_layout = latam
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 3

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
        ignore_opacity = true
    }
}

animations {
    enabled = yes

    bezier = softBounce, 0.34, 1.15, 0.64, 1
    bezier = easeOutQuint,  0.23, 1,    0.32, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    
    animation = windows,       1,     4.0,   softBounce, slide
    animation = windowsIn,     1,     4.0,   softBounce, slide top
    
    animation = windowsOut,    1,     3.5,   easeOutQuint, slide bottom
    
    animation = windowsMove,   1,     4.0,   softBounce

    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  linear

    animation = workspaces,    1,     4.0,   softBounce, slide
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true
}

xwayland {
    force_zero_scaling = true
}

dwindle {
    preserve_split = true
}